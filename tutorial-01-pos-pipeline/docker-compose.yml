services:
  lab:
    # 依存は uv.lock で決まる。ビルドコンテキストはリポジトリルート
    build:
      context: ..
      dockerfile: tutorial-01-pos-pipeline/image/Dockerfile
    image: dequest-tutorial01
    container_name: dequest-tutorial01
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "8889:8888"
    volumes:
      - ./work:/work        # 自分がいじるノートブック。git管理外
      - ./data:/data:ro     # POSの生データ (読み取り専用)
