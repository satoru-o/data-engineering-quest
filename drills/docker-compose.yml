services:
  lab:
    # 依存は uv.lock で決まる。ビルドコンテキストはリポジトリルート
    build:
      context: ..
      dockerfile: drills/image/Dockerfile
    image: dequest-drills
    container_name: dequest-drills
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "8888:8888"
    volumes:
      - ./work:/work        # 自分がいじるノートブック。git管理外
      - ./data:/data:ro     # ドリル用の小さなCSV
